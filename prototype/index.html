<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — Entry Gallery</title>
    <link rel="stylesheet" href="assets/shared.css">
    <style>
        body {
            padding: 64px;
            background-color: #050505;
        }

        .gallery-header {
            margin-bottom: 64px;
            border-bottom: 0.5px solid var(--border);
            padding-bottom: 32px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 48px;
        }

        .gallery-item {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .gallery-item iframe {
            width: 100%;
            height: 600px;
            border: 0.5px solid var(--border);
            background-color: var(--bg);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover iframe {
            transform: translateY(-8px);
            border-color: var(--accent);
        }

        .label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .title {
            font-family: var(--font-display);
            font-size: 24px;
            color: var(--fg);
        }
    </style>
</head>
<body>
    <header class="gallery-header">
        <div class="label">Project: Vault</div>
        <h1 class="title">Luxury Noir Crypto Experience</h1>
    </header>

    <div class="gallery-grid">
        <div class="gallery-item">
            <div class="label">01 / Acquisition</div>
            <div class="title">Landing Page</div>
            <iframe src="screens/landing.html" frameborder="0"></iframe>
        </div>
        <div class="gallery-item">
            <div class="label">02 / Execution</div>
            <div class="title">Institutional Dashboard</div>
            <iframe src="screens/dashboard.html" frameborder="0"></iframe>
        </div>
        <div class="gallery-item">
            <div class="label">03 / Security</div>
            <div class="title">Auth Portal</div>
            <iframe src="screens/auth.html" frameborder="0"></iframe>
        </div>
    </div>
</body>
</html>
