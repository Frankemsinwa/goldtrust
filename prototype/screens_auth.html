<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — Secure Access</title>
    <link rel="stylesheet" href="../assets/shared.css">
    <style>
        .auth-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, var(--surface) 0%, var(--bg) 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 48px;
            background-color: var(--bg);
            border: 0.5px solid var(--border);
            text-align: center;
        }

        .auth-logo {
            font-family: var(--font-display);
            font-size: 24px;
            letter-spacing: 0.3em;
            color: var(--accent);
            margin-bottom: 48px;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: block;
        }

        input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--fg);
            font-family: var(--font-body);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .auth-footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--muted);
        }

        .auth-link {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card gold-glow">
            <div class="auth-logo">VAULT</div>
            
            <form action="dashboard.html">
                <div class="input-group">
                    <label class="input-label">Identity / Email</label>
                    <input type="email" placeholder="investor@private.vault" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Access Key</label>
                    <input type="password" placeholder="••••••••••••" required>
                </div>
                
                <button type="submit" class="button-pill button-primary" style="width: 100%; margin-top: 24px;">Verify Access</button>
            </form>

            <div class="auth-footer">
                New institutional client? <a href="#" class="auth-link">Inquire here</a>
            </div>
        </div>
    </div>
</body>
</html>
